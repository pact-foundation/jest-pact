name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    # ready_for_review is listed so the release PR, which is a draft until a
    # maintainer readies it, gets a run before it is merged
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Jobs only need to read the checkout
permissions:
  contents: read

env:
  # The oldest supported version; the lint, format and Codecov steps use it
  STABLE_NODE_VERSION: 22

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - test

    steps:
      - name: Failed
        run: exit 1
        if: >
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')

  lint:
    name: Lint
    # Drafts are skipped to save the matrix on the bot-maintained release PR,
    # which is force-pushed on every push to master; the completion check
    # goes red on the skipped jobs, which is accepted for a draft
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.STABLE_NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.STABLE_NODE_VERSION }}

      - run: npm install
      - run: npm run lint

  format:
    name: Format
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.STABLE_NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.STABLE_NODE_VERSION }}

      - run: npm install
      - run: npm run format

  test:
    name: >-
      Test
      on ${{ matrix.os }}
      with Node ${{ matrix.node-version }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        os:
          - macos-26-intel
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # No lockfile is committed, so this is a plain install rather than npm ci
      - run: npm install
      - run: npm run dist
        shell: bash

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node-version == env.STABLE_NODE_VERSION && matrix.os == 'ubuntu-latest'
        with:
          report_type: coverage
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && matrix.node-version == env.STABLE_NODE_VERSION && matrix.os == 'ubuntu-latest'
        with:
          report_type: test_results
          files: coverage/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
