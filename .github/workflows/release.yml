---
# Release workflow for jest-pact.
#
# Stage 1: Prepare (trigger: push to master)
#   `prepare` runs `scripts/release.ts prepare`, which uses git-cliff to
#   compute the next version from conventional commits, updates package.json
#   and CHANGELOG.md, force-pushes them to the fixed branch
#   `release/jest-pact`, and creates or updates the draft release PR.
#
# Stage 2: Tag (trigger: release PR merged)
#   `tag` runs `scripts/release.ts tag`, which reads the version from
#   package.json on master and pushes the tag `vX.Y.Z`.
#
# Stage 3: Publish (trigger: tag push matching `v*`)
#   `publish` builds and tests, publishes to npm with trusted publishing, and
#   creates the GitHub release with that version's changelog entry.
#
# The `closed` pull_request type is listed so that Stage 2 fires on merge;
# the `tag` job checks `merged == true` itself. The test workflow runs the
# full build on the release PR once it is marked ready for review, so there
# is no separate verify job.
name: Release

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  complete:
    name: Release completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - prepare
      - tag
      - publish

    steps:
      - name: Failed
        run: exit 1
        if: >
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  prepare:
    name: Update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the tags and full history to compute the version
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install git-cliff and typos
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: git-cliff,typos

      # Node 24 runs TypeScript directly without the type-stripping warning
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update release PR
        run: node scripts/release.ts prepare
        env:
          # The app token, not GITHUB_TOKEN, so the pushed branch triggers workflows
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  tag:
    name: Create release tag
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'release/jest-pact'

    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Create and push release tag
        run: node scripts/release.ts tag
        env:
          # The app token, not GITHUB_TOKEN, so the pushed tag triggers workflows
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/jest-pact

    # id-token for npm trusted publishing; contents to create the GitHub release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs npm 11.5 or later, which ships with Node 24
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # No lockfile is committed, so this is a plain install rather than npm ci
      - run: npm install
      - run: npm run dist

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "jest-pact@${version}" version 2>/dev/null)" ]; then
            echo "jest-pact@${version} is already on the registry; skipping publish"
          else
            npm publish --provenance --tag latest
          fi

      - name: Extract release notes
        run: node scripts/release.ts changelog "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Find previous release tag
        id: previous-tag
        run: |
          git fetch --tags --quiet
          previous=$(git tag --list 'v*' --sort=-version:refname \
            | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          previous_tag: ${{ steps.previous-tag.outputs.tag }}
          draft: false
          prerelease: false
